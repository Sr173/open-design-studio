appId: com.opendesignstudio.app
productName: Open Design Studio

# 打包前先跑 Vite + esbuild build,产物在 dist/ 和 dist-electron/
directories:
  output: release
  buildResources: build

# 包进 .app 的文件 — 极简,只放运行时必须
files:
  - dist                       # vite 产物(renderer)
  - dist-electron              # esbuild 产物(main.mjs / preload.cjs / skill md / __aid_inject.js)
  - package.json               # main 字段指向 dist-electron/main.mjs
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme}"
  - "!**/node_modules/*/{*.d.ts,*.bak}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/.cache"
  - "!**/.{idea,git,DS_Store}"
  - "!**/{tsconfig.json,tslint.json,.eslintrc,.eslintignore,.prettierrc}"

# keytar 已被 Electron safeStorage 替代 — 不再需要 native binding 解压
# chokidar 的 fsevents native 在 macOS 上由 electron-builder + @electron/rebuild 自动处理

# ───────── macOS DMG ─────────
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # 没买 Apple Developer 证书,但 arm64 强制要求至少 ad-hoc 签名
  # identity: '-' = 用 codesign 的 ad-hoc 模式(本机临时签名,不需要证书)
  # 不签会触发 "已损坏" 报错;签了用户仍需右键 → 打开确认一次
  identity: '-'
  # 关闭强制 sandbox(我们需要文件系统访问)
  hardenedRuntime: false
  gatekeeperAssess: false
  # 不要做 notarization(没证书)
  notarize: false

# dmg 外观 — 没自定义图,electron-builder 默认即可
dmg:
  title: ${productName} ${version}
  icon: null
  background: null
  iconSize: 100
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ───────── Windows ─────────
win:
  target:
    # NSIS — 标准 .exe 安装器,用户熟悉
    - target: nsis
      arch:
        - x64
        - arm64
    # Portable — 单文件免安装版,绿色软件,适合 U 盘 / 临时使用
    - target: portable
      arch:
        - x64
  # 没买代码签名证书,Windows SmartScreen 会拦,用户首次需点"仍要运行"
  # 跟 macOS 没 Apple Developer 证书一样的处理

nsis:
  # 让用户自选安装目录(默认 C:\Users\<user>\AppData\Local\Programs\<App>)
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false  # per-user 安装,不需要管理员权限
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Open Design Studio
  artifactName: Open-Design-Studio-Setup-${version}-${arch}.${ext}

portable:
  artifactName: Open-Design-Studio-Portable-${version}-${arch}.${ext}

# afterPack hook 可以用来 strip 不必要的 locale 等,先不用
